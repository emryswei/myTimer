version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: mytimer-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mytimer
      POSTGRES_USER: mytimer_user
      POSTGRES_PASSWORD: mytimer_password

    ports:
      - "15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mytimer_user -d mytimer"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
